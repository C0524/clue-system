<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医疗线索话单系统</title>
<script src="vendor/vue.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<link rel="stylesheet" href="vendor/flatpickr/flatpickr.min.css">
<script src="vendor/flatpickr/flatpickr.min.js"></script>
<script src="vendor/flatpickr/l10n/zh.js"></script>
<script src="assets/js/api-client.js"></script>
<script src="assets/js/http-client.js"></script>
<script src="assets/js/auth-api.js"></script>
<script src="assets/js/clues-api.js"></script>
<script src="assets/js/public-pool-export-utils.js"></script>
<script src="assets/js/users-api.js"></script>
<script src="assets/js/doctors-api.js"></script>
<script src="assets/js/visits-api.js"></script>
<script src="assets/js/import-api.js"></script>
<script src="assets/js/stats-api.js"></script>
<script src="assets/js/logs-api.js"></script>
<script src="assets/js/system-api.js"></script>
<script src="assets/js/modules/revisit-module.js"></script>
<script src="assets/js/modules/clue-edit-module.js"></script>
<script src="assets/js/modules/clue-detail-module.js"></script>
<script src="assets/js/modules/settings-module.js"></script>
<script src="assets/js/auth-client.js"></script>
<script src="assets/js/permissions-client.js"></script>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/utilities.css">
<link rel="stylesheet" href="assets/css/pages/login.css">
<link rel="stylesheet" href="assets/css/pages/clue-list.css">
<link rel="stylesheet" href="assets/css/pages/visits.css">
<link rel="stylesheet" href="assets/css/pages/stats.css">
<link rel="stylesheet" href="assets/css/pages/settings.css">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div id="app">
  <!-- 未登录：只有登录框 -->
  <template v-if="!isLogin">
    <div class="login">
      <h2>账号登录</h2>
      <div class="msg error" v-if="loginError">{{loginError}}</div>
      <div class="input"><label>账号</label><input v-model="loginUser" @keyup.enter="login"></div>
      <div class="input"><label>密码</label><input v-model="loginPwd" type="password" @keyup.enter="login"></div>
      <button @click="login" :disabled="isLoading">{{isLoading?'登录中...':'登录'}}</button>
    </div>
  </template>

  <!-- 已登录：主界面 -->
  <template v-else>
    <div class="main">
      <div class="navbar">
            <div class="top">
          <div class="welcome">欢迎：{{user.username}} [{{user.role}}]</div>
          <div class="settings" ref="settings">
            <button class="settings-btn" @click.stop="toggleSettings">设置 ▾</button>
              <div class="settings-menu" v-if="settingsOpen">
              <div v-if="user.role=='主管' || user.role=='超级管理员'" @click="tab=4;getUsers();closeSettings();" class="settings-item">账号管理</div>
              <div v-if="user.role=='主管' || user.role=='超级管理员'" @click="tab=5;getDoctors();closeSettings();" class="settings-item">医生管理</div>
              <!-- 套电人员管理 已移除 -->
              <div v-if="user.role=='主管' || user.role=='超级管理员'" @click="tab=7;getLogs();closeSettings();" class="settings-item">系统日志</div>
              <div class="settings-divider"></div>
              <div class="settings-item" @click="logout">退出</div>
            </div>
          </div>
        </div>
        <div class="tab">
            <span v-if="userRole!=='运营' && userRole!=='数据'" :class="{on:tab==1}" @click="tab=1">线索录入</span>
            <span :class="{on:tab==2}" @click="tab=2;resetSearch();getUsers();getTaoRen();getList()">话单列表</span>
            <span :class="{on:tab==8}" @click="tab=8;resetSearch();getUsers();getPublicPoolList()">公海线索</span>
            <span :class="{on:tab==6}" @click="tab=6;resetSearch();getBookList();getUsers()">预约记录</span>
            <span :class="{on:tab==10}" @click="tab=10;getDoctors();getExpertSchedule()">专家坐诊表</span>
            <span v-if="user.role!=='套电' && user.role!=='运营'" :class="{on:tab==9}" @click="tab=9;getUsers();getRevisitList()">复诊管理</span>
            <span :class="{on:tab==3}" @click="tab=3;getStatAll()">数据统计</span>
            <span :class="{on:tab==4}" @click="tab=4;getUsers()" v-if="user.role=='主管' || user.role=='超级管理员'">账号管理</span>
            <span :class="{on:tab==5}" @click="tab=5;getDoctors()" v-if="user.role=='主管' || user.role=='超级管理员'">医生管理</span>
            <!-- 套电人员管理 标签已移除 -->
            <span :class="{on:tab==7}" @click="tab=7;getLogs()" v-if="user.role=='主管' || user.role=='超级管理员'">系统日志</span>
          </div>
      </div>
      <!-- 右上浮动操作面板（详情触发） -->
      <div class="row-action-container" style="position:relative">
        <transition name="fade-slide">
          <div class="row-actions" v-if="showRowActionsFlag">
            <div style="display:flex;gap:8px">
            <button class="btn" @click="openEdit(selectedRow)" v-if="can('咨询') || can('医助') || (user.role==='套电' && selectedRow && selectedRow.taoRen===user.username)">修改</button>
            <button class="btn" @click="toggleInlineDetail">详情</button>
            <button v-if="user.role==='超级管理员'" class="btn btn-danger" @click="(selectedRow && delClue(selectedRow.id))">删除</button>
          </div>
          <div class="inline-detail" v-if="showInlineDetail" style="margin-top:8px">
            <div style="font-weight:600;margin-bottom:6px">添加回访记录</div>
            <textarea v-model="inlineVisitContent" rows="3" style="width:280px;padding:8px;border-radius:6px;border:1px solid #ddd"></textarea>
            <div style="margin-top:8px;display:flex;gap:8px">
              <button class="btn" @click="addInlineVisit" :disabled="inlineLoading">{{ inlineLoading ? '添加中...' : '添加回访' }}</button>
              <button class="btn" @click="toggleInlineDetail">关闭</button>
            </div>
          </div>
          </div>
        </transition>
        
      </div>
      <!-- 悬浮提示容器（toast），通过 showMsg() 创建短暂提示 -->
      <div id="toast-container"></div>
        <!-- expired reason tooltip -->
        <div v-if="tooltipVisible" class="expired-tooltip" :style="{ left: tooltipX + 'px', top: tooltipY + 'px' }">{{ tooltipText }}</div>
        <div v-if="linkedTooltipVisible" class="expired-tooltip" :style="{ left: linkedTooltipX + 'px', top: linkedTooltipY + 'px' }">{{ linkedTooltipText }}</div>

      

      <!-- 线索录入（卡片式表单：5 行布局） -->
      <div v-if="tab==1 && userRole!=='运营' && userRole!=='数据'">
        <div class="card form-card">
          <!-- 第一行：套电人员、渠道 -->
          <div class="form-row">
            <div class="input small"><label>套电人员</label><input type="text" :value="(user && user.username) || ''" disabled style="width:100%" /></div>
            <div class="input"><label>渠道</label><select v-model="form.channel"><option value="">请选择</option><option value="抖音">抖音</option><option value="抖音-蓝V">抖音-蓝V</option><option value="快手">快手</option><option value="小红书">小红书</option><option value="视频号">视频号</option><option value="头条">头条</option><option value="百家号">百家号</option><option value="公众号">公众号</option><option value="小白号">小白号</option><option value="介绍">介绍</option><option value="线下自来">线下自来</option><option value="有来医生">有来医生</option><option value="医带患">医带患</option><option value="导入">导入</option><option value="自主挂号">自主挂号</option><option value="树青种草">树青种草</option><option value="树青-挂号网">树青-挂号网</option><option value="其他">其他</option></select></div>
          </div>

          <!-- 第二行：意向专家、科室 -->
          <div class="form-row">
            <div class="input"><label>意向专家</label><select v-model="form.doctor" @change="selectDoc"><option value="">请选择</option><option v-for="d in doctorList" :value="d.name">{{d.name}}</option></select></div>
            <div class="input"><label>科室</label><input v-model="form.department" disabled></div>
          </div>

          <!-- 第三行：客户姓名、性别、年龄 -->
          <div class="form-row">
            <div class="input wide"><label>客户姓名</label><input v-model="form.name"></div>
            <div class="input small"><label>性别</label><select v-model="form.gender"><option value="">请选择</option><option value="男">男</option><option value="女">女</option></select></div>
            <div class="input small"><label>年龄</label><input v-model="form.age" placeholder="年龄（可选）" inputmode="numeric" pattern="\d{1,2}" @input="form.age = ('' + ($event.target.value || '')).replace(/\D/g,'').slice(0,2)"></div>
          </div>

          <!-- 第四行：电话、微信 -->
          <div class="form-row">
            <div class="input"><label>电话</label><input v-model="form.phone" placeholder="电话或微信"></div>
            <div class="input"><label>微信</label><input v-model="form.wechat" placeholder="电话或微信"></div>
          </div>

          <!-- 第五行：咨询备注通栏 -->
          <div class="form-row">
            <div class="input" style="flex:1"><label>咨询备注</label><textarea v-model="form.content" rows="4"></textarea></div>
          </div>

          <!-- 图片上传 -->
          <div class="form-row">
            <div class="input" style="flex:1">
              <label>上传图片（支持多张，选中后自动上传）</label>
              <input type="file" accept="image/*" multiple @change="handleImageFiles" />
              <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
                <div v-for="(q,idx) in uploadQueue" :key="idx" style="width:120px;border:1px solid #eee;padding:6px;border-radius:6px;background:#fff">
                  <div style="width:100%;height:80px;overflow:hidden;display:flex;align-items:center;justify-content:center">
                    <img :src="q.preview" style="max-width:100%;max-height:100%" />
                  </div>
                  <div style="font-size:12px;margin-top:6px;text-align:center">{{ q.file.name }}</div>
                  <div style="margin-top:6px;text-align:center">
                    <span v-if="q.status==='pending'">等待上传</span>
                    <span v-if="q.status==='uploading'">上传中...</span>
                    <span v-if="q.status==='done'">已上传</span>
                    <span v-if="q.status==='error'" style="color:#c00">失败</span>
                  </div>
                  <div style="display:flex;gap:6px;justify-content:center;margin-top:6px">
                    <button class="btn-sm" @click.prevent="removeQueued(idx)">移除</button>
                    <button class="btn-sm" v-if="q.status==='error'" @click.prevent="retryUpload(idx)">重试</button>
                  </div>
                </div>

                <div v-for="(im,ii) in uploadedImages" :key="'u'+ii" style="width:120px;border:1px solid #eee;padding:6px;border-radius:6px;background:#fff">
                  <div style="width:100%;height:80px;overflow:hidden;display:flex;align-items:center;justify-content:center">
                    <img :src="(im.key ? (im.thumbSmallKey ? getImageProxyUrl(im.thumbSmallKey) : (im.thumbKey ? getImageProxyUrl(im.thumbKey) : getImageProxyUrl(im.key))) : (im.thumbUrl || im.url))" loading="lazy" style="max-width:100%;max-height:100%" />
                  </div>
                  <div style="font-size:12px;margin-top:6px;text-align:center">{{ im.filename || im.key }}</div>
                  <div style="display:flex;gap:6px;justify-content:center;margin-top:6px">
                    <button class="btn-sm" @click.prevent="removeUploaded(ii)">删除</button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div style="text-align:left;margin-top:6px">
            <button class="btn-primary" @click="save" :disabled="isLoading">{{isLoading?'提交中...':'提交'}}</button>
          </div>
        </div>
      </div>

      <!-- 话单列表 -->
      <div v-if="tab==2">
        <div class="search-box split-row">
          <div class="search-main-row">
          <div class="input"><label>套电人员</label><select v-model="search.taoRen"><option value="">套电人员</option><option v-for="n in taoRenList" :key="'trf-'+n" :value="n">{{n}}</option></select></div>
          <div class="input"><label>渠道</label><select v-model="search.channel"><option value="">渠道</option><option value="抖音">抖音</option><option value="抖音-蓝V">抖音-蓝V</option><option value="快手">快手</option><option value="小红书">小红书</option><option value="视频号">视频号</option><option value="头条">头条</option><option value="百家号">百家号</option><option value="公众号">公众号</option><option value="小白号">小白号</option><option value="介绍">介绍</option><option value="线下自来">线下自来</option><option value="有来医生">有来医生</option><option value="医带患">医带患</option><option value="导入">导入</option><option value="自主挂号">自主挂号</option><option value="树青种草">树青种草</option><option value="树青-挂号网">树青-挂号网</option><option value="其他">其他</option></select></div>
          <div class="input id-filter"><label>ID</label><input v-model="search.id" placeholder="按 ID 精确或部分匹配"></div>
          <div class="input"><label>姓名</label><input v-model="search.name" placeholder="姓名"></div>
          <div class="input"><label>电话</label><input v-model="search.phone" placeholder="电话"></div>
          <div class="input"><label>微信</label><input v-model="search.wechat" placeholder="微信"></div>
          <div class="input"><label>意向专家</label><select v-model="search.doctor"><option value="">意向专家</option><option v-for="d in doctorList" :value="d.name">{{d.name}}</option></select></div>
          <div class="input"><label>挂号专家</label><select v-model="search.regDoctor"><option value="">挂号专家</option><option v-for="d in doctorList" :value="d.name">{{d.name}}</option></select></div>
          <div class="input"><label>咨询人员</label><select v-model="search.assignedTo"><option value="">咨询人员</option><option v-for="u in consultList" :value="u.username">{{u.username}}{{u.name?('('+u.name+')'):''}}</option></select></div>
          <div class="input"><label>意向</label><select v-model="search.intent"><option value="">意向</option><option value="有效">有效</option><option value="已加微">已加微</option><option value="加微待通过">加微待通过</option><option value="未接">未接</option><option value="无效">无效</option></select></div>
          <div class="input"><label>预约</label><select v-model="search.book"><option value="">预约</option><option value="已预约">已预约</option><option value="未预约">未预约</option></select></div>
          <div class="input"><label>回访状态</label><select v-model="search.visitStatus"><option value="">回访状态</option><option value="未回访">未回访</option><option value="1访">1访</option><option value="2访">2访</option><option value="3访">3访</option><option value="4访">4访</option></select></div>
          <div class="action-group full-row action-toolbar">
            <div class="date-range-toolbar">
              <span class="range-label">时间类型</span>
              <select v-model="search.timeType">
                <option value="">时间类型</option>
                <option value="createTime">创建时间</option>
                <option value="assignedAt">分配时间</option>
              </select>
            </div>
            <div class="date-range-toolbar">
              <span class="range-label">时间范围</span>
              <input type="text" class="js-range-picker" data-start-model="search.timeStart" data-end-model="search.timeEnd" placeholder="时间范围" readonly>
            </div>
            <button @click="doSearch()">搜索</button>
            <button @click="resetSearch();doSearch()" style="background:var(--disabled);">重置</button>
          </div>
          </div>
          <div class="search-extra-actions">
            <button v-if="user.role!=='运营' && user.role!=='数据'" @click="showImportDialog()" style="background:var(--success)">导入数据</button>
            <button @click="exportListByCurrentFilters()" style="background:var(--primary);">导出数据</button>
            <button v-if="user.role==='主管' || user.role==='超级管理员'" @click.stop="openAssignModal()" style="background:#f39c12;color:white;border:none;padding:6px 10px;border-radius:4px;">数据分配</button>
          </div>
        </div>
        <table class="tab-table">
          <tr>
            <th style="width:40px"><input type="checkbox" v-model="selectAllPage" @change="toggleSelectAllPage"></th>
            <th>ID</th><th>创建时间</th><th>分配时间</th><th>套电人员</th><th>渠道</th><th>姓名</th><th>性别</th><th>年龄</th><th>电话</th><th>微信</th><th>意向专家</th><th>挂号专家</th>
            <th>咨询人员</th>
            <th>意向</th><th>回访状态</th><th>预约人员</th><th>预约</th><th>挂号时间</th>
            <th>操作</th>
          </tr>
          <tr v-for="item in pageList" :class="{ 'saved-highlight': highlightedId==item.id }">
            <td><input type="checkbox" :value="item.id" :checked="selectedIds.indexOf(item.id)!==-1" @change="toggleSelectRow(item.id,$event)"></td>
            <td>
              <div v-if="isRestoredFromPublicPool(item)" class="restored-flag">还原单</div>
              <div>{{item.id}}</div>
            </td>
            <td v-html="formatTimeLines(item.createTime)"></td>
            <td v-html="formatTimeLines(item.assignedAt)"></td>
            <td>{{item.taoRen||'-'}}</td>
            <td>{{item.channel||'-'}}</td>
            <td>{{item.name}}</td>
            <td>{{item.gender||'-'}}</td>
            <td>{{item.age||'-'}}</td>
            <td>
              <span
                @click.stop.prevent="showChildClueInfo(item, $event)"
                :style="{
                  color: isLinkedClue(item) ? '#d9534f' : '',
                  cursor: 'pointer',
                  fontWeight: isLinkedClue(item) ? 600 : 400,
                  textDecoration: 'underline'
                }"
                :title="getLinkedClueTitle(item)">
                {{item.phone}}
              </span>
            </td>
            <td>{{item.wechat||'-'}}</td>
            <td>{{item.doctor||'-'}}</td>
            <td>{{item.regDoctor||item.doctor||'-'}}</td>
            <td>{{ item.assignedTo || (((item.visitStatus||'').indexOf('访')!==-1 && item.firstVisitUser) ? item.firstVisitUser : (item.bookUser ? item.bookUser : (item.intentOperator ? item.intentOperator : '-'))) }}</td>
            <td>{{ item.intent || '-' }}</td>
            <td>
              <span :class="((item.visitStatus||'未回访') === '未回访') ? 'status-danger' : 'status-success'"
                    @click.stop.prevent="maybeShowExpiredTooltip(item,$event)"
                    :style="{ cursor: (item.expired==1 || item.visitStatus==='过期单') ? 'pointer' : 'default' }">
                {{item.visitStatus||'未回访'}}
              </span>
            </td>
            <td>
              <template v-if="item.bookUser && item.bookUser !== ''">{{ item.bookUser }}</template>
                <template v-else>
                  <!-- 预约人员由后端自动设置为修改预约状态的账号，无需前端手动选择 -->
                  <template>-</template>
                </template>
            </td>
            <td>
              {{ item.book || '-' }}
            </td>
            <td v-html="formatTimeLines(item.bookTime)"></td>
            <td>
              <button class="btn-sm" @click.stop.prevent="openDetail(item)">详情</button>
                <button v-if="user.role==='超级管理员'" class="btn-sm del" title="删除" @click="delClue(item.id)">🗑️</button>
            </td>
          </tr>
        </table>
        <div class="pagination">
          <div class="page-size">每页显示：<select v-model="pageSize" @change="resetPage"><option>10</option><option>20</option><option>50</option><option>100</option></select> 条</div>
          <div class="controls">第 {{currentPage}} 页 / 共 {{totalPage}} 页 <button @click="prevPage" :disabled="currentPage==1">上一页</button> <button @click="nextPage" :disabled="currentPage==totalPage">下一页</button></div>
          <div class="total">总计：{{totalCount}} 条（过期单：{{ expiredCount }}）</div>
          <div class="unvisited"><div style="display:inline-block;margin-right:12px">未回访：{{ unvisitedTotal }} 条</div><div style="display:inline-block">今日未回访：{{ unvisitedToday }} 条</div></div>
        </div>
      </div>

      <!-- 公海线索 -->
      <div v-if="tab==8">
        <div class="search-box split-row">
          <div class="search-main-row">
          <div class="input"><label>渠道</label><select v-model="search.channel"><option value="">渠道</option><option value="抖音">抖音</option><option value="抖音-蓝V">抖音-蓝V</option><option value="快手">快手</option><option value="小红书">小红书</option><option value="视频号">视频号</option><option value="头条">头条</option><option value="百家号">百家号</option><option value="公众号">公众号</option><option value="小白号">小白号</option><option value="介绍">介绍</option><option value="线下自来">线下自来</option><option value="有来医生">有来医生</option><option value="医带患">医带患</option><option value="导入">导入</option><option value="自主挂号">自主挂号</option><option value="树青种草">树青种草</option><option value="树青-挂号网">树青-挂号网</option><option value="其他">其他</option></select></div>
          <div class="input id-filter"><label>ID</label><input v-model="search.id" placeholder="按 ID 精确或部分匹配"></div>
          <div class="input"><label>姓名</label><input v-model="search.name" placeholder="姓名"></div>
          <div class="input"><label>电话</label><input v-model="search.phone" placeholder="电话"></div>
          <div class="input"><label>微信</label><input v-model="search.wechat" placeholder="微信"></div>
          <div class="input"><label>意向专家</label><select v-model="search.doctor"><option value="">意向专家</option><option v-for="d in doctorList" :value="d.name">{{d.name}}</option></select></div>

                    <input :value="currentDetail.visitMode || '-'" disabled style="width:100%" />

              <div class="detail-line" style="margin-top:6px">

                  </template>
                  <template v-else>
                    <textarea :value="currentDetail.refundReason || ''" rows="3" style="width:100%;margin-top:6px" placeholder="暂无退费原因" readonly></textarea>
                  </template>
                  <div style="margin-top:6px" v-if="!detailEditing">
                    <template v-if="!refundEditing">
                      <button class="btn-sm" v-if="canEditDetail(currentDetail)" @click="startRefundEdit">编辑</button>
                    </template>
                    <template v-else>
                      <button class="btn-sm" @click="saveRefundEdits" :disabled="isLoading">{{isLoading?'保存中...':'保存'}}</button>
                      <button class="btn-sm" style="background:var(--disabled);margin-left:8px" @click="cancelRefundEdit" :disabled="isLoading">取消</button>
                    </template>
                  </div>
                  <div v-if="refundEditing && refundErrors && refundErrors.refundReason" style="color:#c00;font-size:12px;margin-top:6px;">{{ refundErrors.refundReason }}</div>
                </div>
              </div>

              <!-- 新增两行：开药天数/剂型；挂号费/药费/治疗费（仅在预约记录 tab==6 时显示） -->
              <template v-if="tab==6">
                <div class="detail-line detail-grid">
                  <div class="detail-label">开药天数：</div>
                  <div class="detail-val" v-if="!detailEditing">{{ currentDetail.medicineDay || '-' }}</div>
                  <div v-else style="flex:0 0 var(--detail-mid-w)"><select v-model="editDetail.medicineDay"><option value="">请选择</option><option v-for="opt in getMedicineDayOptionsForRecord(currentDetail)" :key="opt" :value="opt">{{ opt }}</option></select></div>
                  <div v-if="detailEditing && detailErrors && detailErrors.medicineDay" style="color:#c00;font-size:12px;margin-top:6px;">{{ detailErrors.medicineDay }}</div>

                  <div class="detail-label">剂型：</div>
                  <div class="detail-val" v-if="!detailEditing">{{ currentDetail.dosageForm || '-' }}</div>
                  <div v-else style="flex:0 0 var(--detail-mid-w)"><select v-model="editDetail.dosageForm"><option value="">请选择</option><option value="饮片">饮片</option><option value="代煎">代煎</option><option value="颗粒">颗粒</option></select></div>
                  <div v-if="detailEditing && detailErrors && detailErrors.dosageForm" style="color:#c00;font-size:12px;margin-top:6px;">{{ detailErrors.dosageForm }}</div>
                </div>

                <div class="detail-line detail-grid">
                  <div class="detail-label">药费：</div>
                  <div class="detail-val" v-if="!detailEditing">{{ currentDetail.cost || 0 }}</div>
                  <div v-else style="flex:0 0 var(--detail-mid-w)"><input type="number" v-model.number="editDetail.cost" style="width:100%" /></div>
                  <div v-if="detailEditing && detailErrors && detailErrors.cost" style="color:#c00;font-size:12px;margin-top:6px;">{{ detailErrors.cost }}</div>

                  <div class="detail-label">治疗费：</div>
                  <div class="detail-val" v-if="!detailEditing">{{ currentDetail.treatmentFee || 0 }}</div>
                  <div v-else style="flex:0 0 var(--detail-mid-w)"><input type="number" v-model.number="editDetail.treatmentFee" style="width:100%" /></div>
                  <div v-if="detailEditing && detailErrors && detailErrors.treatmentFee" style="color:#c00;font-size:12px;margin-top:6px;">{{ detailErrors.treatmentFee }}</div>
                </div>
              </template>

              <!-- 新增：诊前病例收集（咨询可编辑，医助可查看；主管/超级管理员可编辑；套电/运营 不可见） -->
              <div class="detail-line" style="margin-top:6px">
                <div class="detail-label">诊前病例收集：</div>
                <div style="width:100%">
                  <template v-if="user && (user.role === '咨询' || user.role === '主管' || user.role === '超级管理员')">
                    <div v-if="!preCaseEditing">
                      <div style="position:relative;background:var(--table-row-bg);padding:10px 12px;border-radius:6px;margin-top:6px;">
                        <div :style="preCaseExpanded ? 'white-space:pre-wrap;line-height:1.7;word-break:break-word;' : 'white-space:pre-wrap;line-height:1.7;word-break:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;max-height:5.1em;'">{{ currentDetail.preCase || '无' }}</div>
                        <div v-if="!preCaseExpanded && shouldShowPreCaseToggle(currentDetail.preCase)" style="position:absolute;left:0;right:0;bottom:0;height:32px;background:linear-gradient(to top, rgba(245,247,251,0.98), rgba(245,247,251,0));border-radius:0 0 6px 6px;pointer-events:none;"></div>
                      </div>
                      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap;">
                        <div v-if="!preCaseExpanded && shouldShowPreCaseToggle(currentDetail.preCase)" style="color:#6b7280;font-size:12px;">已折叠，仅显示前三行</div>
                        <div style="margin-left:auto;display:flex;gap:8px;align-items:center;">
                          <button v-if="shouldShowPreCaseToggle(currentDetail.preCase)" class="btn-sm" style="font-size:14px;padding:6px 12px;background:#eef4ff;color:#1d4ed8;border:1px solid #bfd6ff;" @click="togglePreCaseExpanded()">{{ preCaseExpanded ? '收起' : '展开全文' }}</button>
                          <button class="btn-sm" @click="startPreCaseEdit">编辑</button>
                        </div>
                      </div>
                    </div>
                    <div v-else>
                      <textarea v-model="preCaseDraft" rows="6" style="width:100%;margin-top:6px;min-height:140px" placeholder="填写诊前病例收集情况（如是否拍照/病历等）"></textarea>
                      <div style="margin-top:6px;text-align:right">
                        <button class="btn-sm" @click="savePreCase">保存</button>
                        <button class="btn-sm" style="background:var(--disabled);margin-left:8px" @click="cancelPreCaseEdit">取消</button>
                      </div>
                    </div>
                  </template>
                  <template v-else-if="user && (user.role === '套电' || user.role === '运营')">
                    <!-- 对套电/运营不可见：什么都不显示 -->
                    <div style="color:var(--text-hint);">-</div>
                  </template>
                  <template v-else>
                    <div style="position:relative;background:var(--table-row-bg);padding:10px 12px;border-radius:6px;margin-top:6px;">
                      <div :style="preCaseExpanded ? 'white-space:pre-wrap;line-height:1.7;word-break:break-word;' : 'white-space:pre-wrap;line-height:1.7;word-break:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;max-height:5.1em;'">{{ currentDetail.preCase || '无' }}</div>
                      <div v-if="!preCaseExpanded && shouldShowPreCaseToggle(currentDetail.preCase)" style="position:absolute;left:0;right:0;bottom:0;height:32px;background:linear-gradient(to top, rgba(245,247,251,0.98), rgba(245,247,251,0));border-radius:0 0 6px 6px;pointer-events:none;"></div>
                    </div>
                    <div style="display:flex;justify-content:flex-end;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap;">
                      <div v-if="!preCaseExpanded && shouldShowPreCaseToggle(currentDetail.preCase)" style="color:#6b7280;font-size:12px;margin-right:auto;">已折叠，仅显示前三行</div>
                      <button v-if="shouldShowPreCaseToggle(currentDetail.preCase)" class="btn-sm" style="font-size:14px;padding:6px 12px;background:#eef4ff;color:#1d4ed8;border:1px solid #bfd6ff;" @click="togglePreCaseExpanded()">{{ preCaseExpanded ? '收起' : '展开全文' }}</button>
                    </div>
                  </template>
                </div>
              </div>

              <!-- 第7行：录入备注内容（支持编辑） -->
              <div class="detail-line" style="margin-top:8px">

                    <textarea v-model="editDetail.content" rows="3" style="width:100%;margin-top:6px"></textarea>
                  </template>
                  <template v-else>
                    <div style="background:var(--table-row-bg);padding:8px;border-radius:6px;margin-top:6px;white-space:pre-wrap">{{ currentDetail.content || '无' }}</div>
                  </template>
                  </div>
                </div>
              </div>

              <!-- 第8行：历史回访内容 -->
              <div class="detail-line" style="margin-top:8px">
                <div class="detail-label">历史回访：</div>
                <div style="margin-top:6px;width:100%">
                  <div v-if="(!currentVisit || currentVisit.length===0)" style="color:#666;padding:6px">暂无回访记录</div>

                    <div style="font-weight:600">{{i+1}}. {{ formatTime(v.time) }} | {{v.user}}</div>
                    <div style="white-space:pre-wrap">{{v.content}}</div>
                  </div>
                </div>
              </div>

              <!-- 第9行：添加回访记录框（在编辑模式下可编辑并可上传图片） -->

                <div style="width:100%">

                  <div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:6px">

                    <template v-if="detailEditing && can('咨询')">
                      <input ref="revisitFileInput" type="file" accept="image/*" multiple style="display:none" @change="handleImageFiles($event)" />

                    </template>

                </div>
              </div>

              <!-- 第10行：附件与查看按钮 -->
              <div class="detail-line" style="margin-top:8px;display:flex;align-items:center;gap:12px">
                <div class="detail-label">附件：</div>
                <div>
                  <span style="color:var(--text-hint);margin-left:8px;" v-if="(currentDetail.images && currentDetail.images.length>0) || (detailEditing && (uploadQueue.length>0 || uploadedImages.length>0))">(共 {{ (currentDetail.images?currentDetail.images.length:0) + (detailEditing?uploadedImages.length:0) }} 张)</span>
                  <!-- inline gallery: always show images associated to this clue; additionally show newly uploaded thumbnails during edit -->
                  <div v-if="!detailEditing && (!currentDetail.images || currentDetail.images.length===0)" style="color:var(--text-hint);margin-top:6px">暂无附件；若刚上传，可能正在生成缩略图，请稍候或刷新。</div>

                        <img :src="getDisplayThumb(img)" loading="lazy" style="max-width:100%;max-height:100%;object-fit:contain;display:block;" />
                      </a>

                      <div style="display:flex;gap:6px;margin-top:6px">

                      </div>
                    </div>

                    <div v-if="detailEditing && (uploadQueue.length>0 || uploadedImages.length>0)" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:0">
                      <div v-for="(q,idx) in uploadQueue" :key="'q'+idx" style="width:80px;border:1px solid #eee;padding:4px;border-radius:6px;background:#fff">

                          <img :src="q.preview" style="max-width:100%;max-height:100%" />

                        <div style="font-size:12px;margin-top:4px;text-align:center">{{ q.file.name }}</div>
                      </div>
                      <div v-for="(im,ii) in uploadedImages" :key="'u'+ii" style="width:80px;border:1px solid #eee;padding:4px;border-radius:6px;background:#fff">
                        <div style="width:100%;height:60px;overflow:hidden;display:flex;align-items:center;justify-content:center">
                          <img :src="getDisplayThumb(im)" loading="lazy" style="max-width:100%;max-height:100%" />
                        </div>
                        <div style="font-size:12px;margin-top:4px;text-align:center">{{ im.filename || im.key }}</div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- 操作按钮区（添加回访/修改/保存/取消） -->
            <div style="margin-top:12px;border-top:1px solid rgba(0,0,0,0.06);padding-top:12px;display:flex;gap:8px;justify-content:flex-end">
                <template v-if="!detailEditing">
                  <button class="btn" @click="startEditDetail" v-if="canEditDetail(currentDetail)">修改</button>
                </template>
                <template v-else>
                  <button class="btn" @click="saveDetailEdits" :disabled="detailSaving || isLoading">{{ (detailSaving || isLoading) ? '保存中...' : '保存修改' }}</button>
                  <button class="btn" style="background:var(--disabled)" @click="cancelEditDetail">取消</button>
                </template>
            </div>
        </div>
      </div>

            <select v-model="revisitForm.visitMode" style="width:100%">

              <option value="线下">线下</option>
              <option value="抄方-线上">抄方-线上</option>

          <div v-if="(revisitVisitList||[]).length===0" style="color:var(--text-hint);padding:6px 0">暂无回访记录</div>
          <div v-for="(v,i) in revisitVisitList" :key="i" style="background:var(--table-row-bg);padding:8px;margin:6px 0;border-radius:6px;">

      const map = {};
      const rows = Array.isArray(this.revisitList) ? this.revisitList : [];
      for(const it of rows){
        const username = it && it.bookUser ? String(it.bookUser).trim() : '';
        if(!username) continue;

  mounted(){
    // 初始化 select 的样式（当值为空时降低文字透明度）
    this.$nextTick(()=>{
      this.updateSelectStyles();
      const appEl = document.getElementById('app');
      if(appEl){
        appEl.addEventListener('change', (e)=>{
          if(e.target && e.target.tagName === 'SELECT') this.updateSingleSelect(e.target);
        });
      }
      // 点击外部关闭设置菜单（全局监听）
      document.addEventListener('click', this.handleGlobalClick);
      this.bindActivityEvents();
      // 暴露全局调试句柄，方便在浏览器控制台访问当前 Vue 实例
      try{ window.__APP = this; }catch(e){}
      this.initDateRangePickers();
      this.bindNumberWheelGuard();
    });

    // Setup server-version polling to detect backend restarts and trigger reload or partial refresh
    const checkServerVersionOnce = async () => {
      try{
        const r = (window.ClueSystemApi && typeof window.ClueSystemApi.serverVersion === 'function')
          ? await window.ClueSystemApi.serverVersion(this)
          : await this.apiCall('/api/server-version?_=' + Date.now(), { cache: 'no-store' });
        if(r && r.code === 200 && r.data && r.data.startedAt){
          if(this.serverVersion && this.serverVersion !== r.data.startedAt){
            try{ this.showMsg('检测到后端已更新，页面将刷新以保持同步'); }catch(e){}
            setTimeout(()=>{ try{ location.reload(); }catch(e){} }, 700);
          }else{
            this.serverVersion = r.data.startedAt;
          }
        }
      }catch(e){ /* ignore transient network errors */ }
    };
    // initial check and periodic polling every 15 seconds
    try{ checkServerVersionOnce.call(this); this._serverVersionTimer = setInterval(checkServerVersionOnce.bind(this), 15000); }catch(e){}
  },

  methods:{
    idleTimeoutMs(){ return 30 * 60 * 1000; },
    onSessionLogin(){
      this.markUserActivity();
      this.scheduleIdleLogoutCheck();
    },
    bindActivityEvents(){
      if(this._activityEventsBound) return;
      this._activityEventsBound = true;
      const handler = this.markUserActivity;
      ['click','keydown','mousedown','touchstart','wheel','scroll'].forEach(evt=>{
        try{ window.addEventListener(evt, handler, { passive: true }); }catch(e){}
      });
      try{ document.addEventListener('visibilitychange', handler); }catch(e){}
    },
    bindNumberWheelGuard(){
      if(this._numberWheelGuardBound) return;
      this._numberWheelGuardBound = true;
      this._numberWheelGuard = (e) => {
        const t = e && e.target;
        if(!t || t.tagName !== 'INPUT') return;
        if(t.type !== 'number') return;
        if(document.activeElement !== t) return;
        // Prevent wheel from accidentally changing numeric values after typing.
        e.preventDefault();
        try{ t.blur(); }catch(_){ }
      };
      try{
        document.addEventListener('wheel', this._numberWheelGuard, { passive: false, capture: true });
      }catch(e){
        try{ document.addEventListener('wheel', this._numberWheelGuard, true); }catch(_){ }
      }
    },
    unbindNumberWheelGuard(){
      if(!this._numberWheelGuardBound || !this._numberWheelGuard) return;
      try{
        document.removeEventListener('wheel', this._numberWheelGuard, { capture: true });
      }catch(e){
        try{ document.removeEventListener('wheel', this._numberWheelGuard, true); }catch(_){ }
      }
      this._numberWheelGuard = null;
      this._numberWheelGuardBound = false;
    },
    unbindActivityEvents(){
      if(!this._activityEventsBound) return;
      this._activityEventsBound = false;
      const handler = this.markUserActivity;
      ['click','keydown','mousedown','touchstart','wheel','scroll'].forEach(evt=>{
        try{ window.removeEventListener(evt, handler, { passive: true }); }catch(e){ try{ window.removeEventListener(evt, handler); }catch(_){} }
      });
      try{ document.removeEventListener('visibilitychange', handler); }catch(e){}
    },
    getPathValue(path){
      if(!path) return '';
      const parts = String(path).split('.');
      let cur = this;
      for(let i=0;i<parts.length;i++){
        if(cur == null) return '';
        cur = cur[parts[i]];
      }
      return cur == null ? '' : cur;
    },
    setPathValue(path, val){
      if(!path) return;
      const parts = String(path).split('.');
      let cur = this;
      for(let i=0;i<parts.length-1;i++){
        if(cur == null) return;
        cur = cur[parts[i]];
      }
      if(cur == null) return;
      const key = parts[parts.length-1];
      this.$set(cur, key, val || '');
    },
    teardownDateRangePickers(){
      try{
        const rangeMap = this._rangePickers || {};
        Object.keys(rangeMap).forEach((k)=>{
          const inst = rangeMap[k];
          if(inst && typeof inst.destroy === 'function') inst.destroy();
        });
      }catch(e){ console.warn('teardownDateRangePickers error', e); }
      try{
        const singleMap = this._singlePickers || {};
        Object.keys(singleMap).forEach((k)=>{
          const inst = singleMap[k];
          if(inst && typeof inst.destroy === 'function') inst.destroy();
        });
      }catch(e){ console.warn('teardownDateRangePickers(single) error', e); }
      this._rangePickers = {};
      this._singlePickers = {};
    },
    initDateRangePickers(){
      if(typeof flatpickr !== 'function') return;
      this.teardownDateRangePickers();
      const root = document.getElementById('app');
      if(!root) return;

      const rangeNodes = root.querySelectorAll('.js-range-picker');
      rangeNodes.forEach((el, idx)=>{
        const startModel = el.getAttribute('data-start-model') || '';
        const endModel = el.getAttribute('data-end-model') || '';
        if(!startModel || !endModel) return;
        const startVal = this.getPathValue(startModel);
        const endVal = this.getPathValue(endModel);
        const defaultDates = [];
        if(startVal) defaultDates.push(startVal);
        if(endVal) defaultDates.push(endVal);
        const inst = flatpickr(el, {
          mode: 'range',
          dateFormat: 'Y-m-d',
          locale: (flatpickr.l10ns && flatpickr.l10ns.zh) ? flatpickr.l10ns.zh : 'default',
          allowInput: false,
          defaultDate: defaultDates,
          onChange: (selectedDates)=>{
            if(!selectedDates || selectedDates.length === 0){
              this.setPathValue(startModel, '');
              this.setPathValue(endModel, '');
              return;
            }
            const fmt = (d)=>flatpickr.formatDate(d, 'Y-m-d');
            this.setPathValue(startModel, fmt(selectedDates[0]));
            this.setPathValue(endModel, selectedDates[1] ? fmt(selectedDates[1]) : '');
          }
        });
        this.$set(this._rangePickers, `${startModel}|${endModel}|${idx}`, inst);
      });

      const singleNodes = root.querySelectorAll('.js-single-picker');
      singleNodes.forEach((el, idx)=>{
        const model = el.getAttribute('data-model') || '';
        if(!model) return;
        const val = this.getPathValue(model);
        const inst = flatpickr(el, {
          mode: 'single',
          dateFormat: 'Y-m-d',
          locale: (flatpickr.l10ns && flatpickr.l10ns.zh) ? flatpickr.l10ns.zh : 'default',
          allowInput: false,
          defaultDate: val || null,
          onChange: (selectedDates)=>{
            if(!selectedDates || selectedDates.length === 0){
              this.setPathValue(model, '');
              return;
            }
            this.setPathValue(model, flatpickr.formatDate(selectedDates[0], 'Y-m-d'));
          }
        });
        this.$set(this._singlePickers, `${model}|${idx}`, inst);
      });
    },
    syncDateRangePickerValues(){
      try{
        const rangeMap = this._rangePickers || {};
        Object.keys(rangeMap).forEach((k)=>{
          const inst = rangeMap[k];
          if(!inst || !inst.input) return;
          const startModel = inst.input.getAttribute('data-start-model') || '';
          const endModel = inst.input.getAttribute('data-end-model') || '';
          const startVal = this.getPathValue(startModel);
          const endVal = this.getPathValue(endModel);
          const values = [];
          if(startVal) values.push(startVal);
          if(endVal) values.push(endVal);
          if(values.length === 0) inst.clear();
          else inst.setDate(values, false);
        });
      }catch(e){ console.warn('syncDateRangePickerValues error', e); }
      try{
        const singleMap = this._singlePickers || {};
        Object.keys(singleMap).forEach((k)=>{
          const inst = singleMap[k];
          if(!inst || !inst.input) return;
          const model = inst.input.getAttribute('data-model') || '';
          const val = this.getPathValue(model);
          if(!val) inst.clear();
          else inst.setDate(val, false);
        });
      }catch(e){ console.warn('syncDateRangePickerValues(single) error', e); }
    },
    markUserActivity(){
      if(!this.isLogin) return;
      const now = Date.now();
      this._lastActivityAt = now;
      if(!this._lastActivityPersistAt || now - this._lastActivityPersistAt > 5000){
        this._lastActivityPersistAt = now;
        try{ localStorage.setItem('lastActiveAt', String(now)); }catch(e){}
      }
      this.scheduleIdleLogoutCheck();
    },
    scheduleIdleLogoutCheck(){
      try{ if(this._idleLogoutTimer) clearTimeout(this._idleLogoutTimer); }catch(e){}
      if(!this.isLogin) return;
      let last = this._lastActivityAt || 0;
      if(!last){
        try{ last = Number(localStorage.getItem('lastActiveAt') || 0) || 0; }catch(e){ last = 0; }
      }
      if(!last) last = Date.now();
      const elapsed = Date.now() - last;
      const remain = this.idleTimeoutMs() - elapsed;
      if(remain <= 0){
        this.handleIdleTimeout();
        return;
      }
      this._idleLogoutTimer = setTimeout(()=>{ this.handleIdleTimeout(); }, remain + 200);
    },
    handleIdleTimeout(){
      if(!this.isLogin) return;
      let last = this._lastActivityAt || 0;
      if(!last){
        try{ last = Number(localStorage.getItem('lastActiveAt') || 0) || 0; }catch(e){ last = 0; }
      }
      if(!last) last = Date.now();
      if(Date.now() - last < this.idleTimeoutMs()){
        this.scheduleIdleLogoutCheck();
        return;
      }
      try{ this.showMsg('30分钟无操作，已自动退出，请重新登录','error'); }catch(e){}
      this.logout();
    },

      await this.getList(this.currentPage || 1);

    // 格式化时间为本地可读字符串：YYYY-MM-DD HH:mm:ss，空值返回 '-'
    formatTime(val){
      if(!val) return '-';
      try{
        const d = new Date(val);
        if(isNaN(d.getTime())) return '-';
        const pad = (n)=> n.toString().padStart(2,'0');
        const Y = d.getFullYear();
        const M = pad(d.getMonth()+1);
        const D = pad(d.getDate());
        const h = pad(d.getHours());
        const m = pad(d.getMinutes());
        const s = pad(d.getSeconds());
        return `${Y}-${M}-${D} ${h}:${m}:${s}`;
      }catch(e){return '-';}
    },
    formatTimeLines(val){
      if(!val) return '-';
      try{
        const d = new Date(val);
        if(isNaN(d.getTime())) return '-';
        const pad = (n)=> n.toString().padStart(2,'0');
        const Y = d.getFullYear();
        const M = pad(d.getMonth()+1);
        const D = pad(d.getDate());
        const h = pad(d.getHours());
        const m = pad(d.getMinutes());
        const s = pad(d.getSeconds());
        const hasTime = h !== '00' || m !== '00' || s !== '00';
        if(hasTime){
          return `<span style="display:block;line-height:1.4">${Y}-${M}-${D}</span><span style="display:block;line-height:1.4;color:var(--text-hint,#999)">${h}:${m}:${s}</span>`;
        }
        return `${Y}-${M}-${D}`;
      }catch(e){return '-';}
    },

    // 图片上传相关方法
    async handleImageFiles(e){
      const files = (e.target && e.target.files) ? Array.from(e.target.files) : [];

        try{
          // 压缩/缩放图片以减少上传体积，提高上传速度
          const compressed = await this.compressImage(f, 1600, 0.78);
          // 保持原始文件信息但上传使用 compressed（File 或 Blob）
          const uploadFile = (compressed instanceof File) ? compressed : new File([compressed], (f.name || 'upload').replace(/\.[^/.]+$/, '') + '.jpg', { type: 'image/jpeg' });
          const preview = URL.createObjectURL(uploadFile);
          this.uploadQueue.push({ file: f, uploadFile, preview, status: 'pending' });
        }catch(err){ console.warn('preview/compress error', err); const preview = URL.createObjectURL(f); this.uploadQueue.push({ file: f, uploadFile: f, preview, status: 'pending' }); }
      }
      // 自动开始上传未上传的项（并发由 uploadSingle 控制）
      this.uploadQueue.forEach((q, idx)=>{ if(q.status === 'pending') this.uploadSingle(idx); });

    // 在浏览器端压缩图片：限制最长边为 maxSide，质量 quality（0-1）
    async compressImage(file, maxSide = 1600, quality = 0.8){
      if(!file || !(file.type || '').startsWith('image/')) return file;
      // 优先使用 createImageBitmap（性能更好），回退到 Image
      try{
        const imgBitmap = await createImageBitmap(file);
        let sw = imgBitmap.width, sh = imgBitmap.height;
        const max = Math.max(sw, sh);
        if(max <= maxSide){
          // 不需要缩放
          imgBitmap.close && imgBitmap.close();
          return file;
        }
        const scale = maxSide / max;
        const dw = Math.round(sw * scale), dh = Math.round(sh * scale);
        const canvas = document.createElement('canvas');
        canvas.width = dw; canvas.height = dh;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(imgBitmap, 0, 0, dw, dh);
        imgBitmap.close && imgBitmap.close();
        return await new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if(!blob) return resolve(file);
            resolve(blob);
          }, 'image/jpeg', quality);
        });
      }catch(e){
        // 回退实现：使用 Image 对象
        return await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = function(ev){
            const img = new Image();
            img.onload = function(){
              let sw = img.width, sh = img.height;
              const max = Math.max(sw, sh);
              if(max <= maxSide){ resolve(file); return; }
              const scale = maxSide / max;
              const dw = Math.round(sw * scale), dh = Math.round(sh * scale);
              const canvas = document.createElement('canvas');
              canvas.width = dw; canvas.height = dh;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, dw, dh);
              canvas.toBlob((blob)=>{ if(!blob) resolve(file); else resolve(blob); }, 'image/jpeg', quality);
            };
            img.onerror = function(){ resolve(file); };
            img.src = ev.target.result;
          };
          reader.onerror = function(){ resolve(file); };
          reader.readAsDataURL(file);
        });
      }
    },
    async uploadSingle(idx){
      const q = this.uploadQueue[idx];
      if(!q || q.status === 'uploading' || q.status === 'done') return;
      q.status = 'uploading';
      try{
        const uploadPayload = {
          file: q.uploadFile || q.file,
          filename: q.file && q.file.name ? q.file.name : 'upload.jpg',
          clueId: this.currentDetail && this.currentDetail.id ? this.currentDetail.id : null,
          visitId: this.revisitDraftId || null,
        };
        let data;
        if(window.ClueVisitsApi && typeof window.ClueVisitsApi.uploadImage === 'function'){
          data = await window.ClueVisitsApi.uploadImage(this, uploadPayload);
        }else{
          const qp = [];
          if(uploadPayload.clueId) qp.push('clueId=' + encodeURIComponent(uploadPayload.clueId));
          if(uploadPayload.visitId) qp.push('visitId=' + encodeURIComponent(uploadPayload.visitId));
          const uploadUrl = '/api/uploadImage' + (qp.length ? ('?' + qp.join('&')) : '');
          const form = new FormData();
          form.append('image', uploadPayload.file, uploadPayload.filename);
          data = await this.apiCall(uploadUrl, { method: 'POST', body: form });
        }
        if(data && data.code === 200 && data.data){
          q.status = 'done';
          const newItem = Object.assign({}, data.data, { filename: q.file.name });
          // 避免重复：如果已存在相同 key 的图片（无论在 uploadedImages 还是 currentDetail.images），则不再添加
          const k = newItem.key;
          const existsInUploaded = this.uploadedImages.some(x => x.key === k);
          const existsInDetail = (this.currentDetail && Array.isArray(this.currentDetail.images)) ? this.currentDetail.images.some(x => x.key === k) : false;
          if(!existsInUploaded && !existsInDetail){
            this.uploadedImages.push(newItem);
          } else {
            // 如果图片已被后端直接关联到当前 detail（clueId），也把它放到 currentDetail.images（去重后）以便立即显示
            if(newItem.clueId && this.currentDetail && String(newItem.clueId) === String(this.currentDetail.id)){
              const exists = (this.currentDetail.images || []).some(x => x.key === k);
              if(!exists){
                try{
                  if(this.$set){
                    const arr = (this.currentDetail.images && Array.isArray(this.currentDetail.images)) ? this.currentDetail.images.concat([newItem]) : [newItem];
                    this.$set(this.currentDetail, 'images', arr);
                  }else if(typeof Vue !== 'undefined' && Vue.set){
                    const arr = (this.currentDetail.images && Array.isArray(this.currentDetail.images)) ? this.currentDetail.images.concat([newItem]) : [newItem];
                    Vue.set(this.currentDetail, 'images', arr);
                  }else{
                    this.currentDetail.images = this.currentDetail.images || [];
                    this.currentDetail.images.push(newItem);
                  }
                }catch(e){
                  this.currentDetail.images = this.currentDetail.images || [];
                  this.currentDetail.images.push(newItem);
                }
              }
            }
          }
          // 上传成功后移除 uploadQueue 中的预览项，避免在上传列表与已上传列表同时显示相同图片
          try{ if(q.preview) URL.revokeObjectURL(q.preview); }catch(e){}
          // 注意：splice 会更新数组索引，但我们只移除当前项（idx），这是安全的
          this.uploadQueue.splice(idx, 1);
        }else{
          q.status = 'error';
          console.warn('upload failed', data);
        }
      }catch(err){
        console.error('uploadSingle error', err);
        if(q) q.status = 'error';
      }
    },

    doRevisitSearch(){
      try{
        const list = this.revisitList || [];
        this.revisitShowList = list.filter(item => {
          if(this.revisitSearch.id && !((''+item.id).includes(this.revisitSearch.id))) return false;
          if(this.revisitSearch.name && !(item.name||'').includes(this.revisitSearch.name)) return false;
          if(this.revisitSearch.phone && !(item.phone||'').includes(this.revisitSearch.phone)) return false;
          if(this.revisitSearch.wechat && !(item.wechat||'').includes(this.revisitSearch.wechat)) return false;
          if(this.revisitSearch.doctor && ((item.doctor||'') !== this.revisitSearch.doctor)) return false;
          if(this.revisitSearch.regDoctor && ((item.regDoctor || item.doctor || '') !== this.revisitSearch.regDoctor)) return false;
          if(this.revisitSearch.bookUser && ((item.bookUser || '') !== this.revisitSearch.bookUser)) return false;
          const diagnosisType = item.visitType || (item.revisitGroupId ? '复诊' : '初诊');
          if(this.revisitSearch.diagnosisType && diagnosisType !== this.revisitSearch.diagnosisType) return false;
          if(this.revisitSearch.visitMode && ((item.visitMode || '') !== this.revisitSearch.visitMode)) return false;
          const timeType = this.revisitSearch.timeType || 'visitDate';
          const filterTimeRaw = timeType === 'createTime' ? item.createTime : item.visitDate;
          const filterTime = new Date(filterTimeRaw);
          if(isNaN(filterTime.getTime())) return false;
          // 日期范围按所选时间类型过滤
          if(this.revisitSearch.arriveStart){
            const start = new Date(this.revisitSearch.arriveStart + 'T00:00:00');
            if(filterTime < start) return false;
          }
          if(this.revisitSearch.arriveEnd){
            const end = new Date(this.revisitSearch.arriveEnd + 'T23:59:59');
            if(filterTime > end) return false;
          }
          return true;
        });
        // 筛选后也按到诊时间降序排序
        try{
          this.revisitShowList.sort((a,b)=>{
            const ta = new Date(a.visitDate || a.createTime).getTime() || 0;
            const tb = new Date(b.visitDate || b.createTime).getTime() || 0;
            return tb - ta;
          });
        }catch(e){ console.warn('revisitShowList sort error', e); }
      }catch(e){ console.error('doRevisitSearch error', e); this.revisitShowList = [...this.revisitList]; }
    },

    can(role){

    extractLogClueId(text){
      const s = (text || '').toString();
      let m = s.match(/(?:clue\s+|修改\s+|批量修改\s+|来源\s+|id\s*=\s*)(\d+)/i);
      if(m && m[1]) return m[1];
      m = s.match(/(?:新增线索|删除线索)\s+(\d+)/);
      if(m && m[1]) return m[1];
      m = s.match(/新\s*(\d+)/);
      if(m && m[1]) return m[1];
      return '-';
    },
    formatLogClueId(log){
      try{
        return this.extractLogClueId(log && log.text);
      }catch(e){ return '-'; }
    },
    normalizeLogValue(v){
      if(v === null || typeof v === 'undefined') return '空';
      const s = ('' + v).trim();
      if(!s || s.toLowerCase() === 'null' || s.toLowerCase() === 'undefined') return '空';
      return s;
    },
    formatLogText(log){
      const text = ((log && log.text) || '').toString();
      if(!text) return '-';

      let m = text.match(/^修改\s+(\d+)\s+([a-zA-Z_]+)=(.*)$/);
      if(m){
        const clueId = m[1];
        const field = this.getLogFieldLabel(m[2]);
        const val = this.normalizeLogValue(m[3]);
        return `修改线索（ID ${clueId}）：${field} -> ${val}`;
      }

      m = text.match(/^批量修改\s+(\d+)\s+keys=(.+)$/);
      if(m){
        const clueId = m[1];
        const labels = (m[2] || '')
          .split(',')
          .map((k) => this.getLogFieldLabel((k || '').trim()))
          .filter(Boolean)
          .join('、');
        return `批量保存线索（ID ${clueId}）：修改了 ${labels || '多个字段'}`;
      }

      m = text.match(/^批量修改\s+(\d+)$/);
      if(m) return `批量保存线索（ID ${m[1]}）`;

      m = text.match(/^创建回访草稿：clue\s+(\d+)\s+visit\s+(\d+)$/i);
      if(m) return `创建回访草稿：线索ID ${m[1]}，回访记录ID ${m[2]}`;

      m = text.match(/^更新回访\s+(\d+)$/);
      if(m) return `更新回访记录内容（回访记录ID ${m[1]}）`;

      m = text.match(/^复诊预约：来源\s+(\d+)，新\s+(\d+)$/);
      if(m) return `创建复诊预约：来源线索ID ${m[1]}，新线索ID ${m[2]}`;

      m = text.match(/^分配\s+(\d+)\s+条线索\s+给\s+(.+)$/);
      if(m) return `分配线索：共 ${m[1]} 条，分配给 ${m[2]}`;

      if(text === '保存回访记录') return '新增回访记录';

      m = text.match(/^新增线索\s+(\d+)：(.+)，医生：(.*)$/);
      if(m) return `新增线索（ID ${m[1]}）：姓名 ${m[2]}，医生 ${m[3] || '未填写'}`;

      m = text.match(/^删除线索\s+(\d+)：(.*)，医生：(.*)$/);
      if(m) return `删除线索（ID ${m[1]}）：姓名 ${m[2] || '未知'}，预约医生 ${m[3] || '未知'}`;

      return text;
    },
    async getLogs(page){
      try{
        if(!page) page = this.logCurrentPage || 1;
        const q = [];
        if(this.logClueId && this.logClueId.trim()) q.push('clueId='+encodeURIComponent(this.logClueId.trim()));
        if(this.logStart) q.push('startDate='+encodeURIComponent(this.logStart));
        if(this.logEnd) q.push('endDate='+encodeURIComponent(this.logEnd));
        q.push('page='+encodeURIComponent(page));
        q.push('pageSize='+encodeURIComponent(this.logPageSize));
        const d = (window.ClueLogsApi && typeof window.ClueLogsApi.getLogs === 'function')
          ? await window.ClueLogsApi.getLogs(this, {
              clueId: this.logClueId && this.logClueId.trim() ? this.logClueId.trim() : '',
              startDate: this.logStart || '',
              endDate: this.logEnd || '',
              page: page,
              pageSize: this.logPageSize,
            })
          : await this.apiCall('/api/logs' + (q.length ? ('?' + q.join('&')) : ''));
        if(d.code===200){
          // 兼容两种后端返回格式：
          // 1) 旧版： data 为数组 -> d.data (array)
          // 2) 新版： data 为对象 { rows, total } -> d.data.rows
          if(Array.isArray(d.data)){
            this.logs = d.data;
            this.logTotal = d.data.length;
          }else if(d.data && Array.isArray(d.data.rows)){
            this.logs = d.data.rows;
            this.logTotal = d.data.total || this.logs.length;
          }else{
            // 没有匹配的格式，清空并打印调试信息
            this.logs = [];
            this.logTotal = 0;
            console.warn('getLogs: unexpected response format', d);
          }
          this.logTotalPage = Math.max(1, Math.ceil(this.logTotal / this.logPageSize));
          // bounds
          this.logCurrentPage = Math.min(Math.max(1, page), this.logTotalPage);
        }
      }catch(e){ console.error('getLogs error', e); }
    },
    resetLogPage(){ this.logCurrentPage = 1; this.getLogs(1); },
    prevLogPage(){ if(this.logCurrentPage>1){ this.logCurrentPage--; this.getLogs(this.logCurrentPage); } },
    nextLogPage(){ if(this.logCurrentPage < this.logTotalPage){ this.logCurrentPage++; this.getLogs(this.logCurrentPage); } },
    selectDoc(){let f=this.doctorList.find(x=>x.name==this.form.doctor);if(f)this.form.department=f.dept;},
    async save(){
      // Ensure taoRen is set to current logged-in user (front-end convenience).
      try{ this.form.taoRen = (this.user && this.user.username) || this.form.taoRen || ''; }catch(e){}
      const errors = [];
      const channelTrim = (this.form.channel || '').toString().trim();
      const doctorTrim = (this.form.doctor || '').toString().trim();
      const phoneTrim = (this.form.phone || '').toString().trim();
      const wechatTrim = (this.form.wechat || '').toString().trim();
      const contentTrim = (this.form.content || '').toString().trim();
      if(!channelTrim) errors.push('渠道');
      if(!doctorTrim) errors.push('意向专家');
      if(!phoneTrim && !wechatTrim) errors.push('电话或微信（至少填一项）');
      if(!contentTrim) errors.push('咨询备注');
      if(errors.length > 0){
        this.showMsg('请填写：' + errors.join('、'), 'error');
        return;
      }
      // 重复校验：如果有电话或微信，先检查是否已存在相同的线索
      let allowForce = false;
      let linkedParentClueId = null;
      try{
        const phoneTrim = (this.form.phone || '').toString().trim();
        const wechatTrim = (this.form.wechat || '').toString().trim();
        if(phoneTrim || wechatTrim){
          // 请求后端返回所有匹配行以便前端判断（后端支持 body.all === true 返回数组）
          const dupPayload = { phone: phoneTrim, wechat: wechatTrim, all: true };
          const dupResp = await this.fetchClues(dupPayload);
          let matches = [];
          if(dupResp && dupResp.code === 200){
            if(Array.isArray(dupResp.data)) matches = dupResp.data;
            else if(dupResp.data && Array.isArray(dupResp.data.rows)) matches = dupResp.data.rows;
          }
          if(matches.length > 0){
            const sorted = matches.slice().sort((a,b)=> new Date(b.createTime) - new Date(a.createTime));
            const last = sorted[0];
            const currentRole = (this.user && this.user.role) || '';
            const currentName = (this.form.name || '').toString().trim();
            const existingName = (last.name || '').toString().trim();
            const isSameName = !!(currentName && existingName && currentName === existingName);
            const isTaoRenRole = currentRole === '套电';
            if(!isTaoRenRole && !isSameName && currentName && existingName){
              const msg = `已有同号码线索录入，但姓名不同。\n\n请确认是否属于不同人员相同号码预约？`;
              const ok = confirm(msg);
              if(!ok) return;
              linkedParentClueId = last.id;
            } else {
              // 如果最近一条被判定为“过期单”，允许用户继续录入但需确认
              try{
                const serverExpired = (typeof last.expired !== 'undefined') ? !!last.expired : this.isExpiredClue(last);
                if(serverExpired){
                  const lastDoctor = last.doctor || '';
                  const currentDoctor = this.form.doctor || '';
                  // 如果是同一医生，不允许再次录入
                  if(lastDoctor && currentDoctor && lastDoctor === currentDoctor){
                    const info = `检测到相同医生(${lastDoctor})的过期单，禁止再次录入。`;
                    try{ alert(info); }catch(e){ console.warn('show same-doctor duplicate alert failed', e); }
                    this.showDuplicateJumpToast(last, info);
                    return;
                  }
                  // 不同医生：提示确认，确认后直接标记为强制插入（后端将放行并生成新 ID）
                  const msg = `检测到相同电话/微信的历史话单为过期单（录入医生：${lastDoctor || '未知'}，录入时间：${last.createTime || '未知'}）\n\n此话单为过期单，之前已咨询过 ${lastDoctor || '未知'}，确认是否继续由当前医生（${currentDoctor || '未知'}）录入新的话单？`;
                  const ok = confirm(msg);
                  if(!ok) return;
                  // 用户确认则允许继续录入并在提交时带上强制标识，后端可放行
                  allowForce = true;
                }else{
                  // 非过期单：阻止新增并提示查看现有线索
                  const info = `检测到相同电话/微信已录入线索\n录入时间：${last.createTime || '未知'}\n所属医生：${last.doctor || '未知'}\n套电人员：${last.taoRen || '未知'}\n\n已阻止新增，请先查看现有线索。`;
                  try{ alert(info); }catch(e){ console.warn('show duplicate alert failed', e); }
                  this.showDuplicateJumpToast(last, '已阻止新增：检测到重复线索');
                  return;
                }
              }catch(e){ console.error('duplicate check handling error', e); return; }
            }
          }
        }
      }catch(e){
        console.error('重复校验异常', e);
        this.showMsg('重复校验失败，请重试','error');
        return;
      }
      this.isLoading=true;
      // include uploaded image keys (if any)
      const images = (this.uploadedImages || []).map(i => i.key).filter(Boolean);
      const payload = Object.assign({}, this.form, { createTime: new Date().toISOString(), images, forceInsert: allowForce, parentClueId: linkedParentClueId || null });
      // 强制使用当前登录账号作为套电人员（前端保证）
      try{ payload.taoRen = (this.user && this.user.username) || payload.taoRen || ''; }catch(e){}
      const data = await this.saveClue(payload);
      this.isLoading=false;
      // 后端可能返回 409 duplicate：仅在“过期单”场景允许强制录入
      if(data && data.code === 409 && data.msg && data.msg.indexOf('duplicate') === 0){
        const ex = data.existing || {};
        const isExpiredDup = !!(ex && (ex.expired === 1 || ex.expired === true || ex.visitStatus === '过期单' || ex.intent === '无效'));

        // 同医生过期单：后端已明确拒绝，前端直接提示并终止
        if(data.msg === 'duplicate_same_doctor'){
          const info = `检测到相同医生(${ex.doctor || this.form.doctor || '未知'})的过期单，禁止再次录入。`;
          try{ alert(info); }catch(e){ console.warn('duplicate_same_doctor alert failed', e); }
          this.showDuplicateJumpToast(ex, info);
          return;
        }

        // 非过期单：直接否决，不提供强制录入
        if(!isExpiredDup){
          const info = `检测到相同电话/微信已录入线索\n录入时间：${ex.createTime||'未知'}\n所属医生：${ex.doctor||'未知'}\n套电人员：${ex.taoRen||'未知'}\n\n已阻止新增，请先查看现有线索。`;
          try{ alert(info); }catch(e){ console.warn('show duplicate alert failed', e); }
          this.showDuplicateJumpToast(ex, '已阻止新增：检测到重复线索');
          return;
        }

        // 过期单（且非同医生）：允许用户二次确认是否强制录入
        const info = `检测到相同电话/微信的历史话单为过期单\n录入时间：${ex.createTime||'未知'}\n所属医生：${ex.doctor||'未知'}\n套电人员：${ex.taoRen||'未知'}\n\n点击确定查看详情，点击取消尝试强制录入（若仍需创建新话单）。`;
        try{
          const ok = confirm(info);
          if(ok){
            try{ this.openDetail(ex); }catch(e){ console.warn('openDetail on duplicate failed', e); }
            return;
          }

          payload.forceInsert = true;
          this.isLoading = true;
          const forced = await this.saveClue(payload);
          this.isLoading = false;
          if(forced && forced.code === 200){
            this.showMsg('提交成功');
              this.maybeShowSameNameReminder(forced && forced.data ? forced.data : null);
            this.form={taoRen:"",channel:"",name:"",gender:"",age:"",phone:"",wechat:"",doctor:"",department:"",content:""};
            try{ this.uploadQueue = []; this.uploadedImages = []; }catch(e){}
            await this.refreshCurrentTabAfterSave();
          }else{
            if(forced && forced.code === 409 && forced.existing){ try{ this.openDetail(forced.existing); }catch(e){} }
          }
          return;
        }catch(e){ console.error('duplicate handling confirmation failed', e); return; }
      }

      if(data && data.code===200){
        this.showMsg('提交成功');
        this.maybeShowSameNameReminder(data && data.data ? data.data : null);
        this.form={taoRen:"",channel:"",name:"",gender:"",age:"",phone:"",wechat:"",doctor:"",department:"",content:""};
        // clear upload lists
        try{ this.uploadQueue = []; this.uploadedImages = []; }catch(e){}
        await this.refreshCurrentTabAfterSave();
      }
    },

    // 返回用于显示的缩略图 URL：优先使用 thumbSmallKey（带版本参数），否则回退到 thumbKey 或原图
    getDisplayThumb(img){
      try{
        if(!img) return '';
        const buildUrlWithVersion = (baseUrl, version) => {
          if(!baseUrl) return '';
          const sep = baseUrl.indexOf('?') === -1 ? '?' : '&';
          return baseUrl + sep + 'v=' + encodeURIComponent(version || '');
        };

        // prefer thumbSmallKey if available
        if(img.thumbSmallKey){
          const base = this.getImageProxyUrl(img.thumbSmallKey);
          return buildUrlWithVersion(base, img.thumbSmallKey);
        }
        if(img.thumbKey){
          const base = this.getImageProxyUrl(img.thumbKey);
          return buildUrlWithVersion(base, img.thumbKey);
        }
        if(img.thumbUrl) return img.thumbUrl;
        if(img.key) return this.getImageProxyUrl(img.key);
        if(img.url) return img.url;
        return '';
      }catch(e){ return (img && (img.thumbUrl || img.url)) ? (img.thumbUrl || img.url) : ''; }
    },

      if(!this.canEditDetail(this.currentDetail)){ this.showMsg('无权限修改该话单','error'); return; }
      this.refundEditing = true;
      this.refundErrors = {};
      this.refundDraft = {
        refundAmount: (this.currentDetail && (this.currentDetail.refundAmount === 0 || this.currentDetail.refundAmount)) ? Number(this.currentDetail.refundAmount) : '',
        refundReason: this.currentDetail && this.currentDetail.refundReason ? this.currentDetail.refundReason : ''

    async saveRefundEdits(){
      if(!this.currentDetail || !this.currentDetail.id){ this.showMsg('无效的线索','error'); return; }
      if(!this.canEditDetail(this.currentDetail)){ this.showMsg('无权限修改该话单','error'); return; }
      this.refundErrors = {};

      const rawAmount = this.refundDraft ? this.refundDraft.refundAmount : undefined;
      const amountFilled = !(rawAmount === '' || rawAmount === null || typeof rawAmount === 'undefined' || Number.isNaN(Number(rawAmount)));
      const reasonVal = this.refundDraft && this.refundDraft.refundReason ? String(this.refundDraft.refundReason).trim() : '';
      const reasonFilled = !!reasonVal;

      if(amountFilled && Number(rawAmount) < 0){
        this.refundErrors.refundAmount = '退费金额不能小于 0';
        this.showMsg('退费金额不能小于 0','error');
        return;
      }
      if(amountFilled !== reasonFilled){
        if(!amountFilled) this.refundErrors.refundAmount = '已填写退费原因时，退费金额为必填项（可填写 0）';
        if(!reasonFilled) this.refundErrors.refundReason = '已填写退费金额时，退费原因为必填项';
        this.showMsg('请同时完善退费金额和退费原因后再保存','error');
        return;
      }

      const newAmount = amountFilled ? Number(rawAmount) : '';
      const newReason = reasonFilled ? reasonVal : '';
      const oldAmount = this.currentDetail && (this.currentDetail.refundAmount === 0 || this.currentDetail.refundAmount) ? Number(this.currentDetail.refundAmount) : '';
      const oldReason = this.currentDetail && this.currentDetail.refundReason ? String(this.currentDetail.refundReason).trim() : '';
      const updates = {};
      if(String(newAmount) !== String(oldAmount)) updates.refundAmount = newAmount;
      if(String(newReason) !== String(oldReason)) updates.refundReason = newReason;

      if(Object.keys(updates).length === 0){
        this.cancelRefundEdit();
        this.showMsg('未检测到退费变更');
        return;
      }

      this.isLoading = true;
      try{
        const resp = await this.updateClueMany({ id: this.currentDetail.id, updates });
        if(!resp || resp.code !== 200){
          this.showMsg((resp && resp.msg) ? resp.msg : '保存失败（退费）','error');
          return;
        }
        await this.fetchAndApplyCurrentDetail(this.currentDetail.id);
        this.cancelRefundEdit();
        this.showMsg('退费信息已保存');
      }catch(e){
        console.error('saveRefundEdits error', e);
        this.showMsg('保存失败（退费）','error');
      }finally{
        this.isLoading = false;
      }
    },
